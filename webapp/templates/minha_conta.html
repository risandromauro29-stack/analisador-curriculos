{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:420px">
  <h1>Minha conta</h1>
  <p class="sub">{{ current_user.nome }} · {{ current_user.email }}{% if current_user.is_admin %} · administrador{% endif %}</p>
  <h2 style="margin-top:18px">Alterar senha</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="senha_atual">Senha atual</label>
    <input type="password" id="senha_atual" name="senha_atual" required>
    <label for="nova_senha">Nova senha</label>
    <input type="password" id="nova_senha" name="nova_senha" required minlength="8">
    <label for="confirmacao">Confirmar nova senha</label>
    <input type="password" id="confirmacao" name="confirmacao" required minlength="8">
    <button type="submit" style="margin-top:18px">Salvar nova senha</button>
  </form>
</div>
{% endblock %}
